name: Live - Modal tests (manual, billable)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select billable run'
        required: true
        type: choice
        options: [modal-sandbox, benchmark]
      release_tag:
        description: 'Published stable GHCR tag required for modal-sandbox'
        type: string
        required: false
      iterations:
        description: 'Benchmark iterations'
        type: choice
        default: '3'
        required: true
        options: ['1', '2', '3', '4', '5']
permissions:
  contents: read
concurrency:
  group: ci-modal-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provider-unit-tests:
    if: inputs.mode == 'modal-sandbox'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable release tag before billable work
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || exit 1
      - name: Test provider without billable calls
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile
        run: python3 -m compileall -q modal_provider tests blender_workspace_poc
  modal-live:
    if: inputs.mode == 'modal-sandbox'
    needs: provider-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_BLENDER_IMAGE: ghcr.io/erland/blender-workspace-blender:${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo 'Modal credentials missing'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal Python SDK
        run: python -m pip install 'modal==1.4.1'
      - name: Execute real Blender Sandbox from published GHCR image
        run: python -m modal_provider.runner --out out-modal --timeout 900 --python-file tests/sandbox_python_example.py
      - name: Validate Python-only Sandbox results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from modal_provider.artifact_validation import validate_python_outputs
          folder=Path('out-modal')
          assert validate_python_outputs(folder)['object_count']==2
          result=json.loads((folder/'modal_run_report.json').read_text())
          assert result['status']=='PASS' and result['sandbox_terminated']
          assert {v['name'] for v in result['artifacts']}=={'scene.blend','scene.glb','scene.json'}
          print('Modal Python-only creation and artifacts: PASS')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-modal-dev002
          path: out-modal/
          if-no-files-found: warn
          retention-days: 7
  validate-benchmark:
    if: inputs.mode == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python3 -m py_compile experiments/modal_function_vs_sandbox.py tests/blender_modal_benchmark.py
      - name: Validate dry run without Modal token or cloud compute
        run: |
          python3 -m pip install 'modal>=1.6,<2'
          python3 experiments/modal_function_vs_sandbox.py --iterations 1
      - name: Build identical Blender benchmark image locally
        run: docker build -f experiments/Dockerfile.modal-benchmark -t blender-modal-benchmark:ci .
      - name: Verify Python and pip in exact Modal benchmark image
        run: |
          docker run --rm --entrypoint python blender-modal-benchmark:ci \
            -c 'import sys,pip; print(sys.version); assert sys.version_info[:2] == (3,12)'
          docker run --rm --entrypoint pip blender-modal-benchmark:ci --version
      - name: Execute fixed workload with headless Blender (no Modal)
        run: |
          docker run --rm --entrypoint blender blender-modal-benchmark:ci \
            -b --factory-startup --python /workspace/tests/blender_modal_benchmark.py \
            | tee blender-benchmark.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          markers=[line.split('BW_MODAL_BENCH_RESULT ',1)[1]
                   for line in Path('blender-benchmark.log').read_text().splitlines()
                   if 'BW_MODAL_BENCH_RESULT ' in line]
          assert len(markers)==1
          result=json.loads(markers[0])
          assert result['mesh_objects']==43
          assert result['vertices']>300 and result['polygons']>300
          assert result['glb_bytes']>1000
          assert result['blender_seconds']>0
          PY

  run-modal-benchmark:
    # Never run paid Modal work for pull requests or unconfirmed dispatches.
    if: inputs.mode == 'benchmark'
    needs: validate-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Optional protection: configure an approval gate for this environment.
    environment: modal-benchmark
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Modal credentials are configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Configure MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as environment secrets for modal-benchmark."
            exit 1
          fi
      - name: Install Modal SDK
        run: python3 -m pip install 'modal>=1.6,<2'
      - name: Run the billable benchmark explicitly requested by dispatch
        run: |
          python3 experiments/modal_function_vs_sandbox.py \
            --execute \
            --iterations "${{ inputs.iterations }}" \
            --output modal-benchmark-results.json
      - name: Publish comparison in GitHub Actions summary
        if: success()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('modal-benchmark-results.json').read_text())
          rows=['## Modal Function vs Sandbox – measured results',
                '',f"Iterations per mode: {data['iterations_per_mode']} (plus one warm-up)",
                '','| Runtime | Median wall time | Blender execution | Startup + transport |',
                '|---|---:|---:|---:|']
          for runtime in ('function','sandbox'):
              v=data['medians'][runtime]
              rows.append(f"| {runtime} | {v['median_client_wall_seconds']:.3f} s | {v['median_blender_seconds']:.3f} s | {v['median_startup_and_transport_seconds']:.3f} s |")
          rows.extend(['','Costs in the JSON are illustrative. Confirm actual Modal billing.'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows)+'\n')
          PY
      - name: Upload comparison JSON as GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-function-vs-sandbox-results
          path: modal-benchmark-results.json
          if-no-files-found: warn
          retention-days: 14
