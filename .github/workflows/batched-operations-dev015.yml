name: DEV-015 Batched Blender operations
on:
  pull_request:
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/batched-operations-dev015.yml'
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/batched-operations-dev015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batched-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bwtest
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: bwtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bwtest -d bwtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bwtest:ci-password@127.0.0.1:5432/bwtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python batch and mocked Modal tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: TypeScript and PostgreSQL MCP tests
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Build service and worker containers
        run: |
          docker build -f service/Dockerfile -t bw-service:dev015 service
          docker build -f job-worker/Dockerfile -t bw-worker:dev015 .
      - name: Build headless Blender
        run: docker build -t bw-blender:dev015 .
      - name: Verify real batched create and edit
        run: |
          mkdir -p batch-artifacts/first batch-artifacts/second
          echo '{"kind":"batch","operations":[{"kind":"add_primitive","name":"Desk Top","primitive":"cube","scale":[3,1,0.2]},{"kind":"add_primitive","name":"Desk Leg","primitive":"cylinder","location":[-1,0,-1]},{"kind":"set_color","name":"Desk Leg","color":[0.2,0.5,0.8]}]}' > batch-create.json
          echo '{"kind":"batch","operations":[{"kind":"set_transform","name":"Desk Top","location":[0,0,2]},{"kind":"duplicate_object","source":"Desk Leg","name":"Desk Leg Copy","location":[1,0,-1],"scale":[0.5,0.5,1]},{"kind":"set_color","name":"Desk Leg Copy","color":[0.9,0.1,0.2]},{"kind":"rename_object","name":"Desk Leg Copy","newName":"Copied Leg"},{"kind":"add_primitive","name":"Desk Lamp","primitive":"sphere","location":[0,0,3]}]}' > batch-edit.json
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/first:/workspace/out" \
            -v "$PWD/batch-create.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/second:/workspace/out" \
            -v "$PWD/batch-artifacts/first:/workspace/previous:ro" \
            -v "$PWD/batch-edit.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 2
          # Derive object IDs from the saved scene; do not fabricate or address by name.
          mkdir -p batch-artifacts/third
          python3 - <<'PY'
          import json
          from pathlib import Path
          scene=json.loads(Path('batch-artifacts/second/scene.json').read_text())
          ids={obj['name']:obj['objectId'] for obj in scene['scene']['objects']}
          operations={'kind':'batch','operations':[
              {'kind':'set_parent','objectId':ids['Copied Leg'],'parentId':ids['Desk Top']},
              {'kind':'rename_object','objectId':ids['Copied Leg'],'newName':'Parented Leg'},
              {'kind':'set_color','objectId':ids['Desk Leg'],'color':[0.2,0.8,0.3]},
              {'kind':'set_parent','objectId':ids['Desk Leg'],'parentId':None}
          ]}
          # The last operation deliberately unparents an existing, unparented object.
          Path('batch-parent.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/third:/workspace/out" \
            -v "$PWD/batch-artifacts/second:/workspace/previous:ro" \
            -v "$PWD/batch-parent.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 3
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts:/workspace/artifacts:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/tests/blender_verify_dev023.py -- \
            /workspace/artifacts/second/scene.blend /workspace/artifacts/third/scene.blend
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          older=json.loads(Path('batch-artifacts/second/scene.json').read_text())['scene']['objects']
          newer=json.loads(Path('batch-artifacts/third/scene.json').read_text())['scene']['objects']
          before={o['name']:o for o in older}
          after={o['name']:o for o in newer}
          assert 'Copied Leg' not in after
          child=after['Parented Leg']
          assert child['objectId']==before['Copied Leg']['objectId']
          assert child['parent']=='Desk Top'
          assert child['localTransform']['location'] != before['Copied Leg']['localTransform']['location']
          assert after['Desk Top']['objectId']==before['Desk Top']['objectId']
          assert after['Desk Leg']['objectId']==before['Desk Leg']['objectId']
          assert (Path('batch-artifacts/third/scene.glb')).stat().st_size>0
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('batch-artifacts/first/scene.json').read_text())
          two=json.loads(Path('batch-artifacts/second/scene.json').read_text())
          names1={x['name'] for x in one['scene']['objects']}
          names2={x['name'] for x in two['scene']['objects']}
          assert {'Desk Top','Desk Leg'} <= names1
          assert {'Desk Top','Desk Leg','Copied Leg','Desk Lamp'} <= names2
          assert 'Copied Leg' not in names1
          assert 'Desk Leg Copy' not in names2
          copy=next(x for x in two['scene']['objects'] if x['name']=='Copied Leg')
          assert copy['localTransform']['location']==[1.0,0.0,-1.0]
          assert copy['localTransform']['scale']==[0.5,0.5,1.0]
          assert next(x for x in two['scene']['objects'] if x['name']=='Desk Leg')['localTransform']['scale']==[1.0,1.0,1.0]
          top=next(x for x in two['scene']['objects'] if x['name']=='Desk Top')
          assert top['localTransform']['location']==[0.0,0.0,2.0]
          # Stable Blender object IDs survive revisions and rename operations.
          import uuid,struct
          id1={o['name']:o['objectId'] for o in one['scene']['objects']}
          id2={o['name']:o['objectId'] for o in two['scene']['objects']}
          for mapping in (id1,id2):
              assert len(set(mapping.values()))==len(mapping)
              assert all(str(uuid.UUID(value,version=4))==value for value in mapping.values())
          assert id1['Desk Top']==id2['Desk Top']
          assert id1['Desk Leg']==id2['Desk Leg']
          assert id2['Copied Leg']!=id1['Desk Leg']
          # glTF JSON chunk must expose the exact object identity in node extras.
          for folder,identities in [('first',id1),('second',id2)]:
              raw=(Path('batch-artifacts')/folder/'scene.glb').read_bytes()
              assert raw[:4]==b'glTF'
              json_size,json_type=struct.unpack_from('<I4s',raw,12)
              assert json_type==b'JSON'
              gltf=json.loads(raw[20:20+json_size])
              exported={n['name']:n.get('extras',{}).get('bw_object_id') for n in gltf['nodes']
                        if n.get('name') in identities}
              assert exported==identities,(folder,exported,identities)
          for name in ['first','second']:
              for ext in ['blend','glb','json']:
                  assert (Path('batch-artifacts')/name/('scene.'+ext)).stat().st_size>0
          PY

          # DEV-024: create a non-primitive mesh as the first scene operation.
          mkdir -p batch-artifacts/custom
          python3 - <<'PY'
          import json
          from pathlib import Path
          mesh={'kind':'add_mesh','name':'Custom Roof','vertices':[
              [-2,-2,0],[2,-2,0],[2,2,0],[-2,2,0],[0,0,3]],
              'faces':[[0,3,2,1],[0,1,4],[1,2,4],[2,3,4],[3,0,4]],
              'color':[0.2,0.5,0.8]}
          Path('custom-mesh.json').write_text(json.dumps(mesh))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/custom:/workspace/out" \
            -v "$PWD/custom-mesh.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          base=Path('batch-artifacts/custom')
          report=json.loads((base/'scene.json').read_text())
          meshes={o['name']:o for o in report['scene']['objects'] if o['type']=='MESH'}
          assert 'Custom Roof' in meshes
          assert meshes['Custom Roof']['objectId']
          raw=(base/'scene.glb').read_bytes()
          assert raw[:4]==b'glTF'
          size,chunk=struct.unpack_from('<I4s',raw,12)
          assert chunk==b'JSON'
          data=json.loads(raw[20:20+size])
          nodes={node['name']:node for node in data['nodes']}
          node=nodes['Custom Roof']
          assert node['extras']['bw_object_id']==meshes['Custom Roof']['objectId']
          triangles=data['meshes'][node['mesh']]['primitives']
          assert triangles
          assert (base/'scene.blend').stat().st_size>0
          PY

          # DEV-025: run all three modifiers on saved mesh objects, including UUID Boolean.
          mkdir -p batch-artifacts/modifier-source batch-artifacts/modifier-edit
          python3 - <<'PY'
          import json
          from pathlib import Path
          operations={'kind':'batch','operations':[
              {'kind':'add_primitive','name':'Beveled','primitive':'cube','location':[-5,0,0]},
              {'kind':'add_primitive','name':'Smoothed','primitive':'cube','location':[5,0,0]},
              {'kind':'add_primitive','name':'Cut Body','primitive':'cube'},
              {'kind':'add_primitive','name':'Cutter','primitive':'cube','location':[0.8,0,0]}]}
          Path('modifier-create.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/modifier-source:/workspace/out" \
            -v "$PWD/modifier-create.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('batch-artifacts/modifier-source/scene.json').read_text())
          ids={x['name']:x['objectId'] for x in report['scene']['objects']}
          operations={'kind':'batch','operations':[
              {'kind':'bevel_mesh','objectId':ids['Beveled'],'width':0.18,'segments':2},
              {'kind':'subdivide_mesh','objectId':ids['Smoothed'],'levels':1},
              {'kind':'boolean_mesh','objectId':ids['Cut Body'],
               'operandId':ids['Cutter'],'operation':'difference'}]}
          Path('modifier-edit.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/modifier-edit:/workspace/out" \
            -v "$PWD/batch-artifacts/modifier-source:/workspace/previous:ro" \
            -v "$PWD/modifier-edit.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 2
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts:/workspace/artifacts:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/tests/blender_verify_dev025.py -- \
            /workspace/artifacts/modifier-source /workspace/artifacts/modifier-edit

          # DEV-026: applied extrude/mirror/array on both primitive and custom meshes.
          mkdir -p batch-artifacts/shape-source batch-artifacts/shape-edited
          python3 - <<'PY'
          import json
          from pathlib import Path
          operations={'kind':'batch','operations':[
              {'kind':'add_primitive','name':'Extruded','primitive':'cube','location':[-6,0,0]},
              {'kind':'add_mesh','name':'Mirrored',
               'vertices':[[1,0,0],[2,0,0],[1,1,0],[1,0,2]],
               'faces':[[0,2,1],[0,1,3],[1,2,3],[2,0,3]],'location':[0,0,0]},
              {'kind':'add_primitive','name':'Repeated','primitive':'cube','location':[6,0,0]}]}
          Path('shape-source.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/shape-source:/workspace/out" \
            -v "$PWD/shape-source.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('batch-artifacts/shape-source/scene.json').read_text())
          ids={obj['name']:obj['objectId'] for obj in report['scene']['objects']}
          operations={'kind':'batch','operations':[
              {'kind':'extrude_face','objectId':ids['Extruded'],'faceIndex':0,'offset':[0,0,2]},
              {'kind':'mirror_mesh','objectId':ids['Mirrored'],'axis':'x'},
              {'kind':'array_mesh','objectId':ids['Repeated'],'count':3,'offset':[3,0,0]}]}
          Path('shape-edited.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/shape-edited:/workspace/out" \
            -v "$PWD/batch-artifacts/shape-source:/workspace/previous:ro" \
            -v "$PWD/shape-edited.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 2
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts:/workspace/artifacts:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/tests/blender_verify_dev026.py -- \
            /workspace/artifacts/shape-source /workspace/artifacts/shape-edited

          # DEV-027: PBR must survive BLEND -> GLB without modifying another object's material.
          mkdir -p batch-artifacts/pbr-source batch-artifacts/pbr-edited
          python3 - <<'PY'
          import json
          from pathlib import Path
          operations={'kind':'batch','operations':[
              {'kind':'add_primitive','name':'PBR Target','primitive':'cube','color':[0.7,0.2,0.1]},
              {'kind':'add_primitive','name':'Untouched','primitive':'sphere','location':[4,0,0],
               'color':[0.2,0.6,0.2]}]}
          Path('pbr-source.json').write_text(json.dumps(operations))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/pbr-source:/workspace/out" \
            -v "$PWD/pbr-source.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('batch-artifacts/pbr-source/scene.json').read_text())
          object_id=next(o['objectId'] for o in report['scene']['objects'] if o['name']=='PBR Target')
          operation={'kind':'set_pbr_material','objectId':object_id,
              'baseColor':[0.1,0.3,0.6],'metallic':0.8,'roughness':0.2,
              'opacity':0.55,'emissionColor':[0.2,0.1,0.0],'emissionStrength':0.4}
          Path('pbr-edit.json').write_text(json.dumps(operation))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/pbr-edited:/workspace/out" \
            -v "$PWD/batch-artifacts/pbr-source:/workspace/previous:ro" \
            -v "$PWD/pbr-edit.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 2
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts:/workspace/artifacts:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/tests/blender_verify_dev027.py -- \
            /workspace/artifacts/pbr-source /workspace/artifacts/pbr-edited

          # DEV-028: re-import a saved, self-contained GLB as a new project scene.
          mkdir -p batch-artifacts/imported batch-artifacts/import-edited
          python3 - <<'PY'
          import json,base64
          from pathlib import Path
          source=Path('batch-artifacts/custom/scene.glb').read_bytes()
          assert len(source)<=120000, 'GLB import test fixture exceeds bounded payload size'
          operation={'kind':'import_glb','name':'Asset',
                     'glbBase64':base64.b64encode(source).decode('ascii')}
          Path('glb-import.json').write_text(json.dumps(operation))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/imported:/workspace/out" \
            -v "$PWD/glb-import.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- NEW /workspace/spec.json 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('batch-artifacts/custom/scene.json').read_text())
          imported=json.loads(Path('batch-artifacts/imported/scene.json').read_text())
          old={o['objectId'] for o in source['scene']['objects']}
          objs=[o for o in imported['scene']['objects'] if o['type']=='MESH']
          assert objs and all(o['name'].startswith('Asset_') for o in objs)
          assert all(o['objectId'] not in old for o in objs)
          op={'kind':'set_transform','objectId':objs[0]['objectId'],'location':[2,1,0]}
          Path('glb-import-edit.json').write_text(json.dumps(op))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/batch-artifacts/import-edited:/workspace/out" \
            -v "$PWD/batch-artifacts/imported:/workspace/previous:ro" \
            -v "$PWD/glb-import-edit.json:/workspace/spec.json:ro" \
            --entrypoint blender bw-blender:dev015 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- /workspace/previous/scene.blend /workspace/spec.json 2
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          source=json.loads(Path('batch-artifacts/imported/scene.json').read_text())
          edited=json.loads(Path('batch-artifacts/import-edited/scene.json').read_text())
          first={o['objectId']:o for o in source['scene']['objects'] if o['type']=='MESH'}
          second={o['objectId']:o for o in edited['scene']['objects'] if o['type']=='MESH'}
          assert first.keys()==second.keys()
          assert any(o['localTransform']['location']==[2.0,1.0,0.0] for o in second.values())
          assert Path('batch-artifacts/import-edited/scene.blend').stat().st_size>0
          raw=Path('batch-artifacts/import-edited/scene.glb').read_bytes()
          assert raw[:4]==b'glTF'
          size,kind=struct.unpack_from('<I4s',raw,12)
          assert kind==b'JSON'
          gltf=json.loads(raw[20:20+size])
          ids={n.get('extras',{}).get('bw_object_id') for n in gltf['nodes']}
          assert set(first).issubset(ids)
          PY
