name: CI - Service
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  service:
    name: Service and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blender_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blender_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blender_test -d blender_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blender_test:ci-only-password@127.0.0.1:5432/blender_workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run all Node/MCP/OAuth/PG/GLB viewer tests
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify migration idempotence
        working-directory: service
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      - name: Enforce Python-first authoring boundary
        run: python3 scripts/check_python_first_boundary.py
