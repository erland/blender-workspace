name: CI - Blender
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  blender:
    name: Blender, Python, geometry, materials and animation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and all provider/sandbox tests
        run: |
          python3 -m compileall -q blender_workspace_poc modal_provider tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Blender once
        run: docker build --progress plain -t blender-workspace:ci .
      - name: DEV-052 verify native BLEND retains packed image textures after source is removed
        run: |
          set -o pipefail
          docker run --rm --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/tests/blender_portable_resources_smoke.py \
            | tee blender-portable-resources.log
          grep -q 'BW_DEV052_PORTABLE_BLENDER PASS' blender-portable-resources.log
      - name: Create Python model and edit saved revision inside Blender
        run: |
          set -eu
          mkdir -p out/first out/second
          chmod 777 out/first out/second
          cp tests/sandbox_python_example.py out/first/model.py
          docker run --rm -v "$PWD/out/first:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/blender_workspace_poc/apply_python.py \
            -- NEW /workspace/out/model.py 1
          cp out/first/scene.blend out/second/input.blend
          cat > out/second/model.py <<'PY'
          import bpy
          bpy.data.objects['Python Cube'].location.x = 1.5
          bpy.ops.mesh.primitive_cylinder_add(radius=0.5,depth=2,location=(4,0,0))
          bpy.context.object.name = 'Python Cylinder'
          PY
          docker run --rm -v "$PWD/out/second:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/blender_workspace_poc/apply_python.py \
            -- /workspace/out/input.blend /workspace/out/model.py 2
      - name: Verify animation is preserved by the Blender GLB exporter
        run: |
          set -o pipefail
          docker run --rm --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/tests/blender_animation_smoke.py \
            | tee blender-animation.log
          grep -q 'BW_ANIMATED_GLB_EXPORT PASS' blender-animation.log
      - name: Verify Python-created immutable scene artifacts and object IDs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from modal_provider.artifact_validation import validate_python_outputs
          first,second=Path('out/first'),Path('out/second')
          assert validate_python_outputs(first)['object_count']==2
          assert validate_python_outputs(second)['object_count']==3
          older=json.loads((first/'scene.json').read_text())['scene']['objects']
          newer=json.loads((second/'scene.json').read_text())['scene']['objects']
          old={o['name']:o['objectId'] for o in older}
          new={o['name']:o['objectId'] for o in newer}
          assert new['Python Cube']==old['Python Cube']
          assert new['Python Sphere']==old['Python Sphere']
          assert new['Python Cylinder'] not in set(old.values())
          assert (first/'scene.blend').read_bytes()!=(second/'scene.blend').read_bytes()
          print('BW_PYTHON_FIRST_SMOKE PASS')
          PY
      - name: Real Blender geometry verification
        run: |
          docker run --rm --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/tests/geometry_inspection_smoke.py \
            | tee blender-geometry-test.log
          grep -q 'BW_DEV030_GEOMETRY PASS' blender-geometry-test.log
      - name: Create and reuse a named PBR material over two Python revisions
        run: |
          set -eu
          mkdir -p dev032-out/first dev032-out/second
          chmod 777 dev032-out/first dev032-out/second
          cat > dev032-out/first/model.py <<'PY'
          import bpy
          from blender_workspace_poc.material_library import create_library_material, assign_library_material
          create_library_material({
              'materialName':'Brushed Aluminium','baseColor':[0.6,0.6,0.65],
              'metallic':0.9,'roughness':0.3,'opacity':1.0,
              'emissionColor':[0,0,0],'emissionStrength':0.0})
          for name,x in [('Desk',0),('Leg',2)]:
              bpy.ops.mesh.primitive_cube_add(location=(x,0,0))
              bpy.context.object.name=name
              assign_library_material(bpy.context.object,'Brushed Aluminium')
          PY
          docker run --rm -v "$PWD/dev032-out/first:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/blender_workspace_poc/apply_python.py \
            -- NEW /workspace/out/model.py 1
          cp dev032-out/first/scene.blend dev032-out/second/input.blend
          cat > dev032-out/second/model.py <<'PY'
          import bpy
          from blender_workspace_poc.material_library import assign_library_material
          bpy.ops.mesh.primitive_cube_add(location=(4,0,0))
          bpy.context.object.name='New Panel'
          assign_library_material(bpy.context.object,'Brushed Aluminium')
          PY
          docker run --rm -v "$PWD/dev032-out/second:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/blender_workspace_poc/apply_python.py \
            -- /workspace/out/input.blend /workspace/out/model.py 2
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          from modal_provider.artifact_validation import validate_python_outputs
          def gltf(path):
              data=path.read_bytes()
              assert data[:4]==b'glTF'
              length,marker=struct.unpack_from('<I4s',data,12)
              assert marker==b'JSON'
              return json.loads(data[20:20+length].decode('utf8'))
          ids=[]
          for rev,names in [('first',{'Desk','Leg'}),('second',{'Desk','Leg','New Panel'})]:
              folder=Path('dev032-out')/rev
              assert validate_python_outputs(folder)['object_count']==len(names)
              report=json.loads((folder/'scene.json').read_text())
              assets=report['scene']['materialLibrary']
              assert len(assets)==1,assets
              mat=assets[0]
              assert mat['name']=='Brushed Aluminium'
              assert set(mat['usedBy'])==names
              assert abs(mat['metallic']-0.9)<1e-5
              assert abs(mat['roughness']-0.3)<1e-5
              assert all(mat['name'] in obj['materials'] for obj in report['scene']['objects'])
              ids.append({obj['name']:obj['objectId'] for obj in report['scene']['objects']})
              scene=gltf(folder/'scene.glb')
              assert any(m.get('name')=='Brushed Aluminium' for m in scene['materials'])
              assert len(scene['nodes'])>=len(names)
              assert (folder/'scene.blend').stat().st_size>100
          assert ids[0]['Desk']==ids[1]['Desk']
          assert ids[0]['Leg']==ids[1]['Leg']
          assert ids[1]['New Panel'] not in set(ids[0].values())
          print('BW_DEV032_PYTHON_MATERIAL_LIBRARY PASS')
          PY
      - name: Verify scene with more than 512 objects and 256 meshes
        run: |
          set -o pipefail
          mkdir -p model001-out
          chmod 777 model001-out
          docker run --rm -v "$PWD/model001-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/tests/blender_large_scene_smoke.py \
            | tee blender-large-scene.log
          grep -q 'BW_MODEL001_LARGE_SCENE PASS' blender-large-scene.log
      - name: Verify procedural shader materials remain colored in GLB
        run: |
          set -o pipefail
          docker run --rm --entrypoint blender blender-workspace:ci \
            -b --factory-startup --python /workspace/tests/blender_glb_material_smoke.py \
            | tee blender-material.log
          grep -q 'BW_MAT001_MATERIAL_FALLBACK PASS' blender-material.log
      - name: Re-export immutable BLEND preview with procedural PBR skin
        run: |
          set -eu
          mkdir -p preview001-out
          chmod 777 preview001-out
          docker run --rm -v "$PWD/preview001-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_preview_source.py
          sha256sum preview001-out/input.blend | cut -d' ' -f1 > preview001-out/before.sha256
          docker run --rm -v "$PWD/preview001-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/blender_workspace_poc/refresh_glb.py \
            -- /workspace/out/input.blend /workspace/out/preview.glb
          python3 tests/check_preview_refresh.py
      - name: Compose saved native models with armatures and materials
        run: |
          set -o pipefail
          mkdir -p dev040-out
          chmod 777 dev040-out
          docker run --rm -v "$PWD/dev040-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_compose_sources.py \
            | tee blender-dev040.log
          grep -q 'BW_DEV040_COMPOSITION PASS' blender-dev040.log
      - name: Verify native BLEND and GLB import in real Blender
        run: |
          set -o pipefail
          mkdir -p dev041-out
          chmod 777 dev041-out
          docker run --rm -v "$PWD/dev041-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_external_import_smoke.py \
            | tee blender-dev041.log
          grep -q 'BW_DEV041_EXTERNAL_IMPORT PASS' blender-dev041.log
      - name: Validate native Blender hair smoke and reload
        run: |
          set -o pipefail
          mkdir -p dev042-out
          chmod 777 dev042-out
          docker run --rm -v "$PWD/dev042-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_hair_diagnostics_smoke.py \
            | tee blender-dev042.log
          grep -q 'BW_DEV042_HAIR PASS' blender-dev042.log
      - name: Verify real Python exception is pinpointed without Modal
        run: |
          set -eu
          mkdir -p dev042-failure
          chmod 777 dev042-failure
          printf "import bpy\\nraise AttributeError('synthetic test failure')\\n" > dev042-failure/model.py
          set +e
          docker run --rm -v "$PWD/dev042-failure:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python-exit-code 1 --python /workspace/blender_workspace_poc/apply_python.py \
            -- NEW /workspace/out/model.py 1 > blender-dev042-failure.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'BW_USER_PYTHON_ERROR type=AttributeError line=2' blender-dev042-failure.log
      - name: DEV-043 Verify native hair and GLB export fallback without Modal
        run: |
          set -o pipefail
          mkdir -p dev043-out
          chmod 777 dev043-out
          docker run --rm -v "$PWD/dev043-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_hair_export_regression.py \
            | tee blender-dev043.log
          grep -q 'BW_DEV043_NATIVE_RELOAD PASS' blender-dev043.log
          grep -q 'BW_DEV043_EXPORT_FALLBACK PASS' blender-dev043.log
          grep -q 'BW_DEV043_HAIR_EXPORT PASS' blender-dev043.log
      - name: DEV-044 Verify bounded hair and modifier metadata without Modal
        run: |
          set -o pipefail
          docker run --rm --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_complexity_inspection_smoke.py \
            | tee blender-dev044.log
          grep -q 'BW_DEV044_COMPLEXITY PASS' blender-dev044.log
      - name: DEV-045 Verify same-process Cycles and native model preservation
        run: |
          set -o pipefail
          mkdir -p dev045-out
          chmod 777 dev045-out
          docker run --rm -v "$PWD/dev045-out:/workspace/out" --entrypoint blender blender-workspace:ci \
            -b --factory-startup --disable-autoexec --python /workspace/tests/blender_inline_render_smoke.py \
            | tee blender-dev045.log
          grep -q 'BW_DEV045_INLINE_RENDER PASS' blender-dev045.log
          grep -q 'BW_DEV045_RENDER_FALLBACK PASS' blender-dev045.log
      - name: Upload Blender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-regression-artifacts
          path: |
            out/
            dev032-out/
          if-no-files-found: warn
          retention-days: 7
