name: DEV-010 Automatic Blender dispatcher
on:
  pull_request:
    paths:
      - 'service/**'
      - 'job-worker/**'
      - '.github/workflows/dispatcher-dev010.yml'
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'job-worker/**'
      - '.github/workflows/dispatcher-dev010.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blender_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blender_workspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blender_test -d blender_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blender_test:ci-only-password@127.0.0.1:5432/blender_workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: service
        run: npm install --no-audit --no-fund
      - name: Test PostgreSQL-backed dispatch and previous MCP behavior
        working-directory: service
        run: npm run check
      - name: Build job worker Docker image
        run: docker build -f job-worker/Dockerfile -t blender-workspace-worker:dev010 .
