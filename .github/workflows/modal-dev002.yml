name: Modal DEV-002
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modal_provider/**'
      - 'tests/test_modal_provider.py'
      - '.github/workflows/modal-dev002.yml'
      - 'docs/dev-002-modal.md'
      - 'Dockerfile'
permissions:
  contents: read
jobs:
  provider-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test provider without billable calls
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile
        run: python3 -m compileall -q modal_provider tests blender_workspace_poc
  modal-live:
    if: github.event_name == 'workflow_dispatch'
    needs: provider-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credentials
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo 'Modal credentials missing'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal Python SDK
        run: python -m pip install 'modal==1.4.1'
      - name: Execute real Blender Sandbox
        run: python -m modal_provider.runner --out out-modal --timeout 900
      - name: Validate downloaded project and animation
        run: |
          python tests/verify_manifest.py out-modal
          python tests/verify_glb.py out-modal/monster_v1.glb out-modal/monster_v2.glb
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("out-modal/modal_run_report.json").read_text())
          assert result["status"]=="PASS" and result["sandbox_terminated"]
          assert len(result["artifacts"])==6
          print("Modal artifacts and lifecycle: PASS")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-modal-dev002
          path: out-modal/
          if-no-files-found: warn
          retention-days: 7
