name: Verify and publish release GHCR images

on:
  pull_request:
    paths:
      - 'service/**'
      - 'job-worker/**'
      - 'modal_provider/**'
      - 'blender_workspace_poc/**'
      - 'Dockerfile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ghcr-dev036.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-dev036-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blender_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blender_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blender_test -d blender_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blender_test:ci-only-password@127.0.0.1:5432/blender_workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TypeScript, MCP, owner-scoped jobs and PostgreSQL
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify Python Modal controller, artifact validation and GHCR pin
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m compileall -q modal_provider blender_workspace_poc tests
      - name: Build images for offline deployment regression
        run: |
          docker build -f service/Dockerfile -t bw-mcp:dev036 service
          docker build -f job-worker/Dockerfile \
            --build-arg MODAL_BLENDER_IMAGE=ghcr.io/erland/blender-workspace-blender:v0.0.0 \
            -t bw-worker:dev036 .
          docker build -f Dockerfile -t bw-blender:dev036 .
      - name: Assert service preflight, pinned job worker, and real Blender smoke
        run: |
          docker run --rm --entrypoint python3 bw-mcp:dev036 \
            -I -c "compile('import bpy', '<ci>', 'exec')"
          docker run --rm --entrypoint python3 bw-worker:dev036 \
            -c "import os; assert os.environ['MODAL_BLENDER_IMAGE']=='ghcr.io/erland/blender-workspace-blender:v0.0.0'"
          docker run --rm bw-blender:dev036

  publish:
    # Only a published, stable GitHub Release can push images.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate stable release tag and source branch
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release commit must belong to main history"
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Blender image with stable version and latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erland/blender-workspace-blender:${{ steps.release.outputs.tag }}
            ghcr.io/erland/blender-workspace-blender:latest
          cache-from: type=gha,scope=blender
          cache-to: type=gha,scope=blender,mode=max
      - name: Publish Job Worker with matching fixed Blender version
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./job-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erland/blender-workspace-job-worker:${{ steps.release.outputs.tag }}
            ghcr.io/erland/blender-workspace-job-worker:latest
          build-args: |
            MODAL_BLENDER_IMAGE=ghcr.io/erland/blender-workspace-blender:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Publish MCP service with stable version and latest
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erland/blender-workspace-mcp:${{ steps.release.outputs.tag }}
            ghcr.io/erland/blender-workspace-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - name: Summarize release images
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "### Published GHCR release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Set BW_IMAGE_TAG=$TAG or BW_IMAGE_TAG=latest in Coolify." >> "$GITHUB_STEP_SUMMARY"
          echo "All three packages have matching version/latest tags; worker pins Blender to $TAG." >> "$GITHUB_STEP_SUMMARY"
          echo "Make the Blender GHCR package publicly readable before Modal execution." >> "$GITHUB_STEP_SUMMARY"
