name: DEV-013 Monster part editing
on:
  pull_request:
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/parts-dev013.yml'
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/parts-dev013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  part-editing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blender_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blender_workspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blender_test -d blender_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blender_test:ci-only-password@127.0.0.1:5432/blender_workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python scene edit schema and Modal mocks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify TypeScript, PostgreSQL and MCP
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Build worker and MCP containers
        run: |
          docker build -f job-worker/Dockerfile -t bw-worker:dev013 .
          docker build -f service/Dockerfile -t bw-service:dev013 service
