name: DEV-033 Python-first MCP and Modal result verification
on:
  pull_request:
    paths:
      - "service/src/mcp/project-tools.ts"
      - "service/__tests__/python-first-mcp.test.mjs"
      - "service/src/jobs/python-script.ts"
      - "modal_provider/runner.py"
      - "tests/test_modal_provider.py"
      - ".github/workflows/python-first-dev033.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trusted Modal controller and result marker without billing
        run: |
          python3 -m py_compile modal_provider/runner.py
          python3 -m unittest discover -s tests -p 'test_modal_provider.py' -v
          python3 -m unittest discover -s tests -p 'test_python_sandbox_artifacts.py' -v
      - name: Compile the production MCP server
        working-directory: service
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build:server
      - name: Verify only Python can author through the MCP API
        working-directory: service
        run: |
          node --test __tests__/python-first-mcp.test.mjs __tests__/python-sandbox.test.mjs
