name: DEV-014 Generic Blender operations
on:
  pull_request:
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/generic-operations-dev014.yml'
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'blender_workspace_poc/**'
      - 'modal_provider/**'
      - 'tests/**'
      - '.github/workflows/generic-operations-dev014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic-modeling:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blender_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blender_workspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blender_test -d blender_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blender_test:ci-only-password@127.0.0.1:5432/blender_workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python operation validation and Modal mocks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: TypeScript and PostgreSQL/MCP tests
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Build headless Blender image
        run: docker build -t bw-blender:dev014 .
      - name: Verify real generic Blender create and edit
        run: |
          mkdir -p generic-evidence/r1 generic-evidence/r2
          printf '%s\n' '{"kind":"add_primitive","name":"Modern Column","primitive":"cylinder","location":[1,2,0],"color":[0.3,0.5,0.8]}' > generic-op-create.json
          printf '%s\n' '{"kind":"set_transform","name":"Modern Column","location":[3,2,1],"scale":[1,1,2]}' > generic-op-edit.json
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/generic-evidence/r1:/workspace/out" \
            -v "$PWD/generic-op-create.json:/workspace/generic-operation.json:ro" \
            --entrypoint blender bw-blender:dev014 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- \
            NEW /workspace/generic-operation.json 1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/generic-evidence/r2:/workspace/out" \
            -v "$PWD/generic-evidence/r1:/workspace/previous:ro" \
            -v "$PWD/generic-op-edit.json:/workspace/generic-operation.json:ro" \
            --entrypoint blender bw-blender:dev014 -b --factory-startup \
            --python /workspace/blender_workspace_poc/apply_operation.py -- \
            /workspace/previous/scene.blend /workspace/generic-operation.json 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('generic-evidence/r1/scene.json').read_text())
          second=json.loads(Path('generic-evidence/r2/scene.json').read_text())
          a=[o for o in first['scene']['objects'] if o['name']=='Modern Column']
          b=[o for o in second['scene']['objects'] if o['name']=='Modern Column']
          assert len(a)==len(b)==1
          assert a[0]['type']==b[0]['type']=='MESH'
          assert b[0]['localTransform']['location']==[3.0,2.0,1.0]
          assert b[0]['localTransform']['scale']==[1.0,1.0,2.0]
          for rev in ('r1','r2'):
              for artifact in ('scene.blend','scene.glb','scene.json'):
                  assert (Path('generic-evidence')/rev/artifact).stat().st_size>0
          PY
      - name: Build service and worker
        run: |
          docker build -f service/Dockerfile -t blender-workspace-service:dev014 service
          docker build -f job-worker/Dockerfile -t blender-workspace-worker:dev014 .
